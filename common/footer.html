<div id="footer">
  <p>&copy; {{ current_year }} Anders Bandt &nbsp;|&nbsp; <span id="email-link"></span></p>
</div>

<script>
  // Email link
  const user = "andersbandt";
  const domain = "gmail.com";
  const email = user + "@" + domain;
  const link = document.createElement("a");
  link.href = "mailto:" + email;
  link.textContent = "Contact me";
  document.getElementById("email-link").appendChild(link);

  // Scroll reveal animations
  document.addEventListener('DOMContentLoaded', function() {
    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll(
      'section, .project-card, body > .bodytext, body > h2, body > header'
    ).forEach(function(el) {
      el.classList.add('fade-in');
      observer.observe(el);
    });
  });
</script>
