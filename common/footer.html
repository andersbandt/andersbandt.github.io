<!-- Placeholder for the email link -->


<script>
  // Split the email into parts
  const user = "andersbandt";
  const domain = "gmail.com";

  // Combine into full email
  const email = user + "@" + domain;

  // Create the <a> element
  const link = document.createElement("a");
  link.href = "mailto:" + email;       // Make it clickable
  link.textContent = "Contact me";       // Text the user sees

  // Insert it into the page
  document.getElementById("email-link").appendChild(link);
</script>
